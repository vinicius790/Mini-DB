[package]
name = "minidb"
version = "1.3.0"
edition = "2021"
rust-version = "1.89"
description = "Banco embarcado sem dependências: SQL relacional, chave-valor, MVCC, replicação, TLS 1.3, protocolo PostgreSQL, HTTP, TCP e ABI C"
license = "MIT"
readme = "README.md"
repository = "https://github.com/vinicius790/Mini-DB"
homepage = "https://github.com/vinicius790/Mini-DB"
keywords = ["database", "embedded", "sql", "btree", "wal"]
categories = ["database-implementations"]

[lib]
name = "mini_db"
crate-type = ["rlib", "cdylib", "staticlib"]
